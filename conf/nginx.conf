# =============================================================================
# nginx.conf — OpenResty 公共骨架
#
# 每个站点的独立配置放在 /data/conf.d/*.conf 中，
# 通过数据卷从外部挂载（与证书、黑名单 DB 同目录）。
#
#   主机目录结构示例：
#     data/
#     ├── conf.d/
#     │   ├── cy.bail.asia.conf
#     │   ├── check.bail.asia.conf
#     │   └── hymn.bail.asia.conf
#     ├── fullchain.pem
#     ├── privkey.pem
#     ├── blacklist.db
#     └── *.log
# =============================================================================

worker_processes  auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------
    # SSL（所有站点共享同一对证书，各 server 块继承）
    # (若修改，需要在`validate.lua`同步修改)
    # ---------------------------------------------------------------
    ssl_certificate     /data/fullchain.pem;
    ssl_certificate_key /data/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------------------------------------------------------------
    # Lua 配置
    # ---------------------------------------------------------------
    lua_package_path  '/app/?.lua;;';
    lua_package_cpath '/usr/lib/lua/5.1/?.so;;';
    lua_shared_dict blacklist     10m;
    lua_shared_dict freq_counter  10m;

    init_by_lua_block {
        require("init").init_by()
    }

    init_worker_by_lua_block {
        require("init").init_worker()
    }

    # ---------------------------------------------------------------
    # 日志格式（原生 nginx access_log，不再需要 Lua logger）
    # ---------------------------------------------------------------
    log_format site_log '$time_local $remote_addr "$request" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

    # ---------------------------------------------------------------
    # 默认 server — 拒绝非法 Host（防止 IP 未匹配任何 site 时漏过）
    # listen ... default_server 确保它接收所有未匹配的请求
    # ---------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        listen 443 quic reuseport default_server;
        server_name _;

        access_log /data/unknown-hosts.log site_log;

        location / {
            access_by_lua_block {
                require("router").reject_invalid_host()
            }
        }
    }

    # ---------------------------------------------------------------
    # 站点配置（从数据卷加载，每个 .conf 对应一个 server 块）
    # ---------------------------------------------------------------
    include /data/conf.d/*.conf;
}
